video:
  width: 1080
  height: 1920
  fps: 30
  target_duration_seconds: 45

voice:
  name: "en-US-AndrewNeural"
  rate: "+8%"
  pitch: "+0Hz"

captions:
  whisper_model: "base"
  compute_type: "int8"
  font: "Montserrat-ExtraBold"
  font_size: 92
  color: "#FFFFFF"
  highlight_color: "#FFE600"
  stroke_color: "#000000"
  stroke_width: 7
  words_per_batch: 3
  y_frac: 0.62

audio:
  music_volume: 0.12
  voice_volume: 1.0

visuals:
  ken_burns_zoom_ratio: 1.15
  transition_duration: 0.15    # punch-in marks each cut; short crossfade is enough
  max_download_workers: 4

render:
  preset: "veryfast"
  crf: 20

script:
  model: "gemini-2.5-flash"
  niche: "science facts"
  words_per_second: 2.5
  seconds_per_scene: 3.5

effects:
  punch: 0.07            # punch-in zoom strength on each cut (0 to disable)
  caption_pop: 0.18      # caption word pop-in scale overshoot
  emphasis_color: "#FF3B3B"   # color for key-fact words when not highlighted
  sfx_volume: 0.3        # whoosh/hit volume (0–1)
  sfx_every: 2           # play whoosh on every Nth scene cut
  grade: true            # mild contrast + saturation grade for a unified look
